<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Qué cocino hoy?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>¿Qué cocino hoy?</h1>
    <p class="subtitulo">Cargá lo que tenés en la heladera y te sugerimos platos.</p>

    <div class="idea-box">
      <p><strong>¿No sabés qué cocinar?</strong> Mirá algunas ideas al azar, sin cargar nada.</p>
      <button id="btnRandom" class="secundario">🎲 Sorprendeme</button>
      <div id="ideas"></div>
    </div>

    <div class="carga">
      <input type="text" id="inputIngrediente" list="sugerencias"
             placeholder="Ej: huevo" autocomplete="off">
      <datalist id="sugerencias"></datalist>
      <button id="btnAgregar">Agregar</button>
    </div>

    <ul id="listaIngredientes" class="chips"></ul>

    <section>
      <h2>✅ Podés cocinar</h2>
      <h3 class="subseccion">Platos completos</h3>
      <div id="listosSolos"></div>
      <h3 class="subseccion">Platos principales</h3>
      <div id="listosPrincipales"></div>
      <h3 class="subseccion">Acompañamientos</h3>
      <div id="listosAcomp"></div>
    </section>

    <section>
      <h2>🍽️ Combinaciones sugeridas</h2>
      <div id="combos"></div>
      <button id="btnCombos" class="secundario" hidden>Ver otras combinaciones</button>
    </section>

    <section>
      <h2>🛒 Te faltan pocos ingredientes</h2>
      <div id="casi"></div>
    </section>
  </main>

  <script src="platos.js"></script>
  <script src="app.js"></script>
</body>
</html>
